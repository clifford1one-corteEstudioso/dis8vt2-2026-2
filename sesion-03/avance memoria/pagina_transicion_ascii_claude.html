<h2 class="sr-only">Maqueta de una página de transición 16:9 en fondo negro, con textura ASCII a sangre que se desvanece hacia el centro donde aparece el título del capítulo.</h2>
<div style="background: var(--surface-1); border-radius: 12px; padding: 16px;">
  <div id="pg" style="position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; border-radius: 4px;">
    <pre id="asc" style="position:absolute; inset:0; margin:0; font-family: var(--font-mono); font-size: 7px; line-height: 7px; letter-spacing: 0; color: #2BE86A; white-space: pre; overflow: hidden; -webkit-mask-image: radial-gradient(ellipse 42% 34% at 50% 50%, transparent 0%, transparent 42%, #000 100%); mask-image: radial-gradient(ellipse 42% 34% at 50% 50%, transparent 0%, transparent 42%, #000 100%);"></pre>
    <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;">
      <div style="font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px; color: #2BE86A;">[ 01 / 03 ]</div>
      <div style="font-family: var(--font-mono); font-size: 30px; font-weight: 500; letter-spacing: 1px; color: #F2F2F2; text-align:center;">BIOLOGÍA HUMANA</div>
      <div style="font-family: var(--font-mono); font-size: 11px; letter-spacing: 1px; color: #6E7A72; text-align:center; max-width: 60%;">mecanismos de supervivencia en un entorno para el que no evolucionamos</div>
    </div>
  </div>
</div>
<script>
(function(){
  var el=document.getElementById('asc');
  var box=document.getElementById('pg').getBoundingClientRect();
  var cw=4.2, ch=7;
  var cols=Math.ceil(box.width/cw)+2, rows=Math.ceil(box.height/ch)+2;
  var dense="01#%@&$8BWM";
  var mid="+=*:;~<>|/\\";
  var light=".,'`\u00b7-";
  var out=[];
  for(var r=0;r<rows;r++){
    var line="";
    for(var c=0;c<cols;c++){
      var dx=(c/cols-0.5)*2, dy=(r/rows-0.5)*2;
      var d=Math.sqrt(dx*dx*1.0+dy*dy*1.6);
      var p=Math.min(1,Math.max(0,(d-0.35)/0.75));
      var n=Math.random();
      if(n>p*0.92){ line+=" "; continue; }
      var pool = p>0.72?dense:(p>0.45?mid:light);
      line+=pool.charAt(Math.floor(Math.random()*pool.length));
    }
    out.push(line);
  }
  el.textContent=out.join("\n");
})();
</script>
